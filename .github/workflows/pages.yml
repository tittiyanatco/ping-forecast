name: Publish forecast dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package published snapshot
        run: |
          python3 -c "import json,re,pathlib; html=pathlib.Path('index.html').read_text(); data=json.loads(re.search(r'^const DATA = (.+);$',html,re.M).group(1)); snapshot=json.loads(pathlib.Path('snapshot.json').read_text()); assert data['origin_date']==snapshot['origin_date']; assert data['forecast_track_id']=='operational-realtime-inputs-v1'; assert data['era5_features']==[]; assert len(data['forecasts'])==snapshot['forecast_count']"
          mkdir _site
          cp index.html snapshot.json .nojekyll _site/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
